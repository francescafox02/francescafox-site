<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Francesca Fox | She's a Fox</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://unpkg.com/cursor-effects@latest/dist/browser.js"></script>

  <style>
    :root {
      --pink: #ff0767;
      --green: #79ff00;
      --black: #050505;
      --white: #f5f5f5;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #101010, #000);
      color: var(--white);
      cursor: crosshair;
    }

    /* HEADER */

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      border-bottom: 1px solid #202020;
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(5, 5, 5, 0.95);
    }

    header h2 {
      color: var(--white);
      letter-spacing: 2px;
      font-size: 1.15rem;
      margin: 0;
    }

    .diamond {
      display: inline-block;
      margin: 0 6px;
      color: var(--pink);
    }

    .diamond-left {
      animation: rotateLeft 4s linear infinite;
    }

    .diamond-right {
      animation: rotateRight 4s linear infinite;
    }

    .apostrophe {
      color: var(--pink);
    }

    @keyframes rotateLeft {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }

    @keyframes rotateRight {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    nav {
      display: flex;
      gap: 25px;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: var(--green);
      font-size: 0.8rem;
      letter-spacing: 1px;
      transition: color 0.3s;
    }

    nav a:hover,
    nav a.selected {
      color: var(--pink);
    }

    /* PORTFOLIO */

    .portfolio {
      display: none;
      padding-bottom: 60px;
    }

    .portfolio.active {
      display: block;
    }

    /* GALLERY */

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      padding: 35px 40px;
      max-width: 1600px;
      margin: auto;
      align-items: start;
    }

    .art {
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .art img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform 0.4s, filter 0.4s;
    }

    .art:hover img {
      transform: scale(1.04);
      filter: brightness(1.1);
    }

    .overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 20px 12px 12px;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      opacity: 0;
      transition: opacity 0.3s;
      color: var(--pink);
      font-size: 0.8rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      pointer-events: none;
    }

    #art .overlay {
      color: var(--green);
    }

    .art:hover .overlay {
      opacity: 1;
    }

    /* TIKTOK EMBED */

    .tiktok-item {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      overflow: hidden;
    }

    .tiktok-item blockquote {
      margin: 0 !important;
    }

    /* INFO + CONTACT */

    .section {
      display: none;
      padding: 65px 30px;
      max-width: 650px;
      margin: auto;
      text-align: center;
    }

    .section h2 {
      color: var(--green);
      letter-spacing: 2px;
      font-size: 1rem;
      text-transform: uppercase;
    }

    .section p {
      color: #aaa;
      line-height: 1.8;
      font-size: 0.95rem;
    }

    .section a {
      color: var(--pink);
      text-decoration: none;
    }

    .section a:hover {
      color: var(--green);
    }

    /* LIGHTBOX */

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.96);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 40px 20px;
      text-align: center;
      animation: fadeIn 0.3s ease;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 75%;
      object-fit: contain;
      margin-bottom: 20px;
    }

    .lightbox-caption h3 {
      color: var(--pink);
      margin-bottom: 10px;
    }

    .lightbox-caption p {
      color: #999;
      max-width: 500px;
      font-size: 0.9rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* FOOTER */

    footer {
      text-align: center;
      padding: 35px;
      color: #555;
      font-size: 0.75rem;
      letter-spacing: 1px;
      border-top: 1px solid #171717;
    }

    /* MOBILE */

    @media(max-width: 800px) {
      header {
        padding: 18px 20px;
      }

      nav {
        gap: 14px;
      }

      nav a {
        font-size: 0.7rem;
      }

      .gallery {
        grid-template-columns: repeat(2, 1fr);
        padding: 20px;
        gap: 12px;
      }
    }

    @media(max-width: 500px) {
      header {
        flex-direction: column;
        gap: 15px;
      }

      .gallery {
        grid-template-columns: 1fr;
      }
    }

  </style>
</head>
